databases:
  - name: openmat-db
    plan: free
    databaseName: openmat
    user: openmat

services:
  - type: web
    name: openmat-api
    runtime: node
    plan: free
    region: oregon
    # Bundles the API (apps/api/dist). Start runs database migrations first
    # (a no-op when the schema is current), then the production server.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @openmat/api build
    startCommand: cd apps/api && node dist/migrate.js && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Worker processes; raise to about one per CPU core on bigger plans.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: openmat-db
          property: connectionString

  - type: web
    name: openmat-web
    runtime: static
    # Static sites have no plan field — the schema's staticService definition
    # only requires type/name/runtime. plan: free is invalid here (only valid
    # on serverService via serverPlan enum). openmat-api keeps plan: free.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @openmat/web build
    staticPublishPath: apps/web/dist
    # SPA fallback: serve index.html for any path that doesn't match a real
    # file, so react-router deep links work on direct hits and refresh. Render
    # only applies the rewrite if no resource exists at the requested path,
    # so /assets/* (hashed bundles, etc.) still serve directly.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      # After the first deploy, set PUBLIC_BASE_URL on openmat-api to
      # "https://openmat-web.onrender.com" so director links in email
      # point at the real web origin.
      - key: RENDER_DEPLOY_NOTICE
        value: "After first deploy, set openmat-api env PUBLIC_BASE_URL=https://openmat-web.onrender.com (or your custom domain)."
