databases:
  - name: openmat-db
    plan: free
    databaseName: openmat
    user: openmat

services:
  - type: web
    name: openmat-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @openmat/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: openmat-db
          property: connectionString

  - type: static_site
    name: openmat-web
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @openmat/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # After the first deploy, set PUBLIC_BASE_URL on openmat-api to
      # "https://openmat-web.onrender.com" so director links in email
      # point at the real web origin.
      - key: RENDER_DEPLOY_NOTICE
        value: "After first deploy, set openmat-api env PUBLIC_BASE_URL=https://openmat-web.onrender.com (or your custom domain)."
